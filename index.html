<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilik Komputer ✨ Sistem Tempahan – Maahad Pontian</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
      color:#1e1b4b;min-height:100vh;overflow-x:hidden;
      background:#ede9fe;
      background-image:
        radial-gradient(circle at 12% 8%,#c4b5fd 0,transparent 42%),
        radial-gradient(circle at 88% 28%,#fde68a66 0,transparent 36%),
        radial-gradient(circle at 40% 100%,#a5b4fc 0,transparent 48%);
      background-attachment:fixed;
    }
    .orb{position:fixed;border-radius:50%;filter:blur(44px);opacity:.45;z-index:0;pointer-events:none;animation:float 16s ease-in-out infinite alternate}
    .o1{width:320px;height:320px;background:#a78bfa;top:-120px;left:-120px}
    .o2{width:260px;height:260px;background:#fcd34d;top:30%;right:-130px;animation-delay:-5s}
    .o3{width:340px;height:340px;background:#60a5fa;bottom:-160px;left:-80px;animation-delay:-9s}
    @keyframes float{to{transform:translate(34px,-44px) scale(1.08)}}

    .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:16px 14px 160px}

    /* hero */
    .hero{background:linear-gradient(135deg,#1e1b4b 0%,#4c1d95 55%,#7c3aed 100%);color:#fff;border-radius:26px;padding:18px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 44px -14px rgba(76,29,149,.6);position:relative;overflow:hidden}
    .hero::after{content:"";position:absolute;right:-50px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(#f5c51877,transparent 70%)}
    .logo{width:54px;height:54px;border-radius:17px;background:#fff;padding:4px;object-fit:contain;flex-shrink:0;box-shadow:0 0 0 3px #f5c51899}
    .hero-eyebrow{font-size:10px;letter-spacing:2px;opacity:.75;font-weight:700}
    .hero-title{font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1.1;margin-top:2px}
    .hero-sub{font-size:12px;opacity:.9;margin-top:4px}
    .lock{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;position:relative;z-index:1}
    .lock.on{background:#f5c518;color:#1e1b4b;border-color:#f5c518}

    /* segmented control */
    .seg{display:flex;gap:4px;background:rgba(255,255,255,.7);padding:4px;border-radius:18px;margin:14px 0;box-shadow:0 8px 20px -14px #4c1d95}
    .seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:14px;font:inherit;font-size:12px;font-weight:700;color:#6d28d9;cursor:pointer;transition:all .2s}
    .seg button.on{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;box-shadow:0 6px 14px -6px #7c3aed}
    .seg.small button{font-size:11px;padding:9px 4px}

    /* glass cards */
    .glass{background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.75);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 14px 30px -18px #4c1d95}
    .admin{border:2px dashed #c4b5fd;background:rgba(255,255,255,.88)}
    .past{opacity:.75}
    .eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8b5cf6}
    .muted{color:#6b7280;font-size:12px}
    .center{text-align:center}
    .empty{text-align:center;color:#9ca3af;font-size:13px;padding:18px}
    .hint-card{background:#fff;border-radius:18px;padding:14px;text-align:center;color:#7c3aed;font-size:13px;font-weight:700;margin-bottom:12px}
    .row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
    .btn-row{display:flex;gap:6px;align-items:center}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .grid-add{display:grid;grid-template-columns:1fr auto;gap:8px}
    .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f3f0ff}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .chip{border:0;border-radius:99px;padding:6px 12px;font:inherit;font-size:12px;font-weight:700;background:#ede9fe;color:#6d28d9;cursor:pointer}
    .chip-amber{background:#fef3c7;color:#92400e}
    .hint{font-size:12px;color:#7c3aed;margin-top:10px;background:#ede9fe;border-radius:10px;padding:6px 10px;display:inline-block}
    .err-box{font-size:12px;color:#be123c;background:#fff1f2;border:1px solid #fecdd3;border-radius:12px;padding:8px 10px;margin:10px 0}
    .check{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;color:#b45309;margin-bottom:10px}

    /* stats */
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
    .stat-row.two{grid-template-columns:1fr 1fr}
    .stat{border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
    .stat b{font-size:24px;line-height:1}
    .stat span{font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:5px;font-weight:700}
    .stat-free{background:#ecfdf5;color:#047857}
    .stat-busy{background:#fef2f2;color:#b91c1c}
    .stat-pend{background:#fffbeb;color:#b45309}
    .meter{height:8px;border-radius:99px;background:#ede9fe;overflow:hidden}
    .meter i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#f5c518,#f87171);border-radius:99px;transition:width .6s}

    /* date bar */
    .datebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .dt{text-align:center;flex:1;cursor:pointer}
    .dt-big{font-weight:800;font-size:16px;margin-top:2px}
    .mini-date{font:inherit;font-size:11px;background:transparent;border:0;color:#7c3aed;margin-top:4px;cursor:pointer;text-align:center}
    .arrow{width:42px;height:42px;border-radius:14px;border:0;background:#fff;color:#6d28d9;font-size:20px;cursor:pointer;box-shadow:0 6px 14px -8px #4c1d95;flex-shrink:0}
    .arrow:disabled{opacity:.35;cursor:not-allowed}

    /* form */
    .field{width:100%;background:#f5f3ff;border:1.5px solid #ddd6fe;border-radius:14px;padding:11px 12px;font:inherit;font-size:14px;color:#1e1b4b;outline:none;transition:box-shadow .2s,border-color .2s}
    .field:focus{border-color:#8b5cf6;box-shadow:0 0 0 4px #ddd6fe}
    .label{font-size:11px;font-weight:800;color:#7c3aed;letter-spacing:1px;text-transform:uppercase;margin:0 0 6px}
    .btn{border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .2s}
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;box-shadow:0 10px 22px -10px #7c3aed}
    .btn-ghost{background:transparent;border:1.5px solid #c4b5fd;color:#6d28d9}
    .btn-danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
    .btn-ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
    .btn-sm{padding:6px 10px;font-size:12px;border-radius:10px}
    .block{width:100%;margin-top:10px}

    /* slot board */
    .board-cap{font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#8b5cf6;margin:6px 0 8px}
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .board-2{grid-template-columns:1fr 1fr}
    .slot{border-radius:16px;padding:10px 6px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;cursor:pointer;background:#fff;transition:transform .18s,box-shadow .18s;min-width:0}
    .slot:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 18px -12px #4c1d95}
    .slot:disabled{cursor:not-allowed}
    .slot-id{font-weight:900;font-size:14px}
    .slot-time{font-size:9px;opacity:.75;text-align:center;line-height:1.25}
    .slot-st{font-size:10px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .s-free{background:#f0fdf4;border-color:#bbf7d0;color:#065f46}
    .s-busy{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
    .s-pend{background:#fffbeb;border-color:#fde68a;color:#b45309;animation:pulse 2s infinite}
    .s-nilam{background:repeating-linear-gradient(45deg,#f5f3ff,#f5f3ff 6px,#ede9fe 6px,#ede9fe 12px);border-color:#c4b5fd;color:#7c3aed}
    .s-luar{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
    .s-sel{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border-color:#6d28d9;box-shadow:0 10px 20px -10px #7c3aed;transform:scale(1.04)}
    .s-sel .slot-time{opacity:.9}
    @keyframes pulse{50%{box-shadow:0 0 0 5px #fde68a66}}

    /* tickets */
    .ticket{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:#fff;border-left:5px solid #a78bfa;margin-bottom:8px;box-shadow:0 8px 18px -14px #4c1d95}
    .tk-pend{border-left-color:#f59e0b}
    .tk-ok{border-left-color:#10b981}
    .ticket>div:first-child{min-width:0;flex:1}
    .tk-slot{font-weight:800;font-size:14px;color:#1e1b4b}
    .tk-nama{font-size:12px;color:#4b5563;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tk-meta{font-size:11px;color:#9ca3af;margin-top:2px}
    .tk-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
    .tag{font-size:9px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.8px}
    .tag-ok{background:#d1fae5;color:#065f46}
    .tag-pend{background:#fef3c7;color:#92400e}

    /* calendar */
    .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .cal-title{font-weight:800;font-size:14px}
    .icon-btn{width:38px;height:38px;border-radius:13px;border:0;background:#fff;color:#6d28d9;font-size:20px;cursor:pointer;box-shadow:0 6px 14px -8px #4c1d95}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .cal-dow{font-size:10px;text-align:center;color:#8b5cf6;font-weight:800;letter-spacing:1px;padding-bottom:4px}
    .cal-cell{aspect-ratio:1/1;border-radius:14px;border:1.5px solid transparent;background:#faf9ff;font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#1e1b4b;padding:0;transition:transform .15s}
    .cal-cell:hover:not(:disabled){transform:scale(1.06)}
    .cal-cell:disabled{opacity:.3;cursor:not-allowed}
    .c-kosong{background:#fff;border-color:#ede9fe}
    .c-ada{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}
    .c-penuh{background:linear-gradient(135deg,#fde68a,#fbbf24);color:#78350f;box-shadow:0 0 10px -2px #f59e0b99}
    .c-cuti{background:#fee2e2;color:#991b1b;border-color:#fecaca}
    .is-today{outline:2px dashed #7c3aed;outline-offset:2px}
    .is-sel{border-color:#4c1d95!important}
    .dots{font-style:normal;font-size:8px;background:#7c3aed;color:#fff;border-radius:99px;padding:1px 5px;font-weight:800}
    .legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;margin:12px 0 4px;color:#6b7280}
    .lg::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
    .lg-penuh::before{background:#fbbf24}
    .lg-ada::before{background:#c4b5fd}
    .lg-cuti::before{background:#fca5a5}
    .lg-kosong::before{background:#fff;border:1px solid #d1d5db}

    /* charts + leaderboard */
    .bar-row{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:12px;margin:9px 0}
    .bar-lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
    .bar{height:10px;border-radius:99px;background:#ede9fe;overflow:hidden}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#7c3aed);border-radius:99px;transition:width .6s}
    .lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff;margin-bottom:8px;box-shadow:0 6px 16px -12px #4c1d95}
    .medal{font-size:20px;width:30px;text-align:center;flex-shrink:0}
    .acc{border:1px solid #ede9fe;border-radius:16px;background:#fff;margin-bottom:8px;overflow:hidden}
    .acc-today{border-color:#a78bfa}
    .acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:#1e1b4b;text-align:left}
    .acc-body{padding:0 12px 12px}

    /* toast, dock, modal, burst */
    .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:16px;font-weight:700;font-size:13px;z-index:200;box-shadow:0 14px 30px -10px #0008;max-width:92vw;animation:drop .35s cubic-bezier(.2,1.3,.4,1)}
    .t-ok{background:#065f46;color:#ecfdf5}
    .t-err{background:#9f1239;color:#fff1f2}
    @keyframes drop{from{transform:translate(-50%,-24px);opacity:0}}
    .dock{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 14px 14px;background:linear-gradient(rgba(237,233,254,0),#ede9fe 40%)}
    .dock-in{max-width:640px;margin:0 auto;background:#1e1b4b;color:#fff;border-radius:20px;padding:12px 12px 12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 40px -14px #1e1b4b}
    .dock-info{flex:1;min-width:0;font-size:12px;color:#ddd6fe}
    .dock-info b{color:#fff}
    .dock-list{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .warn{display:block;color:#fcd34d;font-size:11px;margin-top:3px}
    .dock .btn-primary{background:linear-gradient(135deg,#f5c518,#fbbf24);color:#1e1b4b;box-shadow:0 8px 18px -8px #f5c518}
    .dock .btn:disabled{background:#4b4680;color:#a5a0d6;box-shadow:none}
    .mbg{position:fixed;inset:0;background:rgba(30,27,75,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;animation:fade .2s}
    @keyframes fade{from{opacity:0}}
    .modal{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:420px;max-height:84vh;overflow:auto;box-shadow:0 30px 60px -20px #1e1b4b;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
    @keyframes pop{from{transform:scale(.9);opacity:0}}
    .modal h3{margin:4px 0 8px;font-size:17px}
    .big-emoji{font-size:44px;line-height:1.1}
    .pin{width:100%;text-align:center;font:inherit;font-size:28px;letter-spacing:12px;padding:12px;border-radius:16px;border:2px solid #ddd6fe;margin:14px 0 4px;outline:none}
    .pin:focus{border-color:#8b5cf6}
    .shake{animation:shake .4s}
    @keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
    .spin{width:28px;height:28px;margin:22px auto;border:3px solid #ddd6fe;border-top-color:#7c3aed;border-radius:50%;animation:sp .8s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .burst{position:fixed;left:50%;top:38%;width:0;height:0;z-index:300;pointer-events:none}
    .burst i{position:absolute;width:9px;height:9px;border-radius:3px;animation:boom 1.3s ease-out forwards}
    @keyframes boom{to{transform:translate(var(--x),240px) rotate(var(--r));opacity:0}}
    .pend-card{background:linear-gradient(135deg,#fffbeb,#fff);border:1px solid #fde68a}
    .modal-head{margin-bottom:10px}
    .s-blok{background:repeating-linear-gradient(135deg,#e5e7eb,#e5e7eb 6px,#f3f4f6 6px,#f3f4f6 12px);border-color:#9ca3af;color:#374151}
    .c-tutup{background:repeating-linear-gradient(135deg,#e5e7eb,#e5e7eb 5px,#f9fafb 5px,#f9fafb 10px);color:#374151;border-color:#9ca3af}
    .dots-shut{background:#374151}
    .lg-tutup::before{background:repeating-linear-gradient(135deg,#9ca3af,#9ca3af 2px,#f3f4f6 2px,#f3f4f6 4px)}
    .tk-blok{border-left-color:#6b7280;background:#f9fafb}
    .tag-blok{background:#e5e7eb;color:#374151}
    .chip-on{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff}
    .closed-card{background:linear-gradient(135deg,#f3f4f6,#fff);border:1px solid #d1d5db;color:#374151}
    @media (max-width:420px){.board{gap:6px}.stat b{font-size:20px}}
  </style>
</head>

  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div id="root"></div>

/* ───────────── Supabase ───────────── */
const sbHeaders = extra => ({
  apikey: SB_KEY, Authorization: "Bearer " + SB_KEY,
  "Content-Type": "application/json", Prefer: "return=minimal", ...(extra || {})
});
function qs(f) {
  const p = [];
  const x = f || {};
  if (x.eq) Object.entries(x.eq).forEach(([k, v]) => p.push(k + "=eq." + encodeURIComponent(v)));
  if (x.in) Object.entries(x.in).forEach(([k, v]) => p.push(k + "=in.(" + v.map(q => encodeURIComponent(q)).join(",") + ")"));
  if (x.like) Object.entries(x.like).forEach(([k, v]) => p.push(k + "=like." + encodeURIComponent(v)));
  if (x.select) p.push("select=" + x.select);
  if (x.order) p.push("order=" + x.order);
  return p.join("&");
}
async function sbGet(table, f) {
  const res = await fetch(SB_URL + "/rest/v1/" + table + "?" + qs(f), { headers: sbHeaders() });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function sbSend(method, table, query, body, extra) {
  const res = await fetch(SB_URL + "/rest/v1/" + table + (query ? "?" + query : ""), {
    method, headers: sbHeaders(extra), body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(await res.text());
}
const db = {
  bookingsOn: d => sbGet("bk_bookings", { eq: { room_name: ROOM_NAME, date: d }, order: "created_at.asc" }),
  insert: (d, rows) => sbSend("POST", "bk_bookings", null, rows.map(b => ({
    id: String(b.id), room_name: ROOM_NAME, date: d, slot: b.slot || null, mula: b.mula || null,
    tamat: b.tamat || null, nama: b.nama, status: b.status, masa: b.masa || null, alasan: b.alasan || null
  }))),
  remove: id => sbSend("DELETE", "bk_bookings", qs({ eq: { room_name: ROOM_NAME, id: String(id) } })),
  removeSlots: (d, slots) => sbSend("DELETE", "bk_bookings", qs({ eq: { room_name: ROOM_NAME, date: d }, in: { slot: slots } })),
  setStatus: id => sbSend("PATCH", "bk_bookings", qs({ eq: { room_name: ROOM_NAME, id: String(id) } }), { status: "lulus" }),
  allDates: async () => {
    const rows = await sbGet("bk_bookings", { eq: { room_name: ROOM_NAME }, select: "date", order: "date.desc" });
    return [...new Set(rows.map(r => r.date))].sort().reverse();
  },
  calCounts: async () => {
    const rows = await sbGet("bk_bookings", { eq: { room_name: ROOM_NAME }, select: "date,slot,status,alasan", in: { slot: AVAIL } });
    const counts = {}, blocked = {};
    rows.forEach(r => {
      if (r.status === "blok") {
        blocked[r.date] = blocked[r.date] || { n: 0, alasan: r.alasan };
        blocked[r.date].n++;
      } else counts[r.date] = (counts[r.date] || 0) + 1;
    });
    return { counts, blocked };
  },
  blocks: () => sbGet("bk_bookings", { eq: { room_name: ROOM_NAME, status: "blok" }, order: "date.asc" }),
  removeMany: ids => sbSend("DELETE", "bk_bookings", qs({ eq: { room_name: ROOM_NAME }, in: { id: ids.map(String) } })),
  holidays: async () => (await sbGet("bk_holidays", { eq: { room_name: ROOM_NAME }, select: "date" })).map(r => r.date),
  addHoliday: d => sbSend("POST", "bk_holidays", "on_conflict=room_name,date", [{ room_name: ROOM_NAME, date: d }],
    { Prefer: "resolution=ignore-duplicates,return=minimal" }),
  delHoliday: d => sbSend("DELETE", "bk_holidays", qs({ eq: { room_name: ROOM_NAME, date: d } })),
  guru: async () => (await sbGet("bk_guru", { eq: { room_name: ROOM_NAME }, order: "nama.asc", select: "nama" })).map(r => r.nama),
  addGuru: n => sbSend("POST", "bk_guru", null, [{ room_name: ROOM_NAME, nama: n }]),
  delGuru: n => sbSend("DELETE", "bk_guru", qs({ eq: { room_name: ROOM_NAME, nama: n } })),
  byPerson: n => sbGet("bk_bookings", { eq: { room_name: ROOM_NAME, nama: n }, order: "date.desc" }),
  byMonth: (y, m) => sbGet("bk_bookings", { eq: { room_name: ROOM_NAME }, like: { date: y + "-" + PAD(m) + "%" } }),
  byYear: y => sbGet("bk_bookings", { eq: { room_name: ROOM_NAME }, like: { date: y + "%" }, order: "date.asc,created_at.asc" }),
  byRange: async (a, b) => {
    const rows = await sbGet("bk_bookings", { eq: { room_name: ROOM_NAME }, order: "date.asc,created_at.asc" });
    return rows.filter(r => r.date >= a && r.date <= b);
  }
};

function MonthCalendar({ date, counts, blocked, holidays, onPick }) {
  const base = new Date(date + "T00:00:00");
  const [vy, setVy] = useState(base.getFullYear());
  const [vm, setVm] = useState(base.getMonth());
  const today = todayStr();
  const first = new Date(vy, vm, 1).getDay();
  const days = new Date(vy, vm + 1, 0).getDate();
  const cells = [...Array(first).fill(null), ...Array.from({ length: days }, (_, i) => i + 1)];
  const move = n => { const d = new Date(vy, vm + n, 1); setVy(d.getFullYear()); setVm(d.getMonth()); };
  return h("div", { className: "glass" },
    h("div", { className: "cal-head" },
      h("button", { className: "icon-btn", onClick: () => move(-1) }, "‹"),
      h("div", { className: "cal-title" }, new Date(vy, vm, 1).toLocaleDateString("ms-MY", { month: "long", year: "numeric" }).toUpperCase()),
      h("button", { className: "icon-btn", onClick: () => move(1) }, "›")),
    h("div", { className: "cal-grid" },
      DAYS.map(d => h("div", { key: d, className: "cal-dow" }, d)),
      cells.map((d, i) => {
        if (!d) return h("div", { key: "e" + i });
        const ds = vy + "-" + PAD(vm + 1) + "-" + PAD(d);
        const n = counts[ds] || 0;
        const cut = isCuti(ds, holidays);
        const bk = blocked[ds];
        const shut = bk && bk.n >= AVAIL.length;
        const state = shut ? "c-tutup" : cut ? "c-cuti" : n >= 8 ? "c-penuh" : n > 0 ? "c-ada" : "c-kosong";
        const cls = "cal-cell " + state + (ds === today ? " is-today" : "") + (ds === date ? " is-sel" : "");
        return h("button", { key: d, type: "button", disabled: ds < today, className: cls, onClick: () => onPick(ds) },
          h("span", null, d),
          shut ? h("i", { className: "dots dots-shut" }, "TUTUP")
            : cut ? h("i", { className: "dots" }, "CUTI")
              : (n > 0 ? h("i", { className: "dots" }, n) : null));
      })),
    h("div", { className: "legend" },
      h("span", { className: "lg lg-penuh" }, "Penuh"),
      h("span", { className: "lg lg-ada" }, "Ada tempahan"),
      h("span", { className: "lg lg-cuti" }, "Cuti"),
      h("span", { className: "lg lg-tutup" }, "Ditutup"),
      h("span", { className: "lg lg-kosong" }, "Kosong")));
}

function SlotBoard({ bookings, selected, onToggle, wholeDay, admin }) {
  const tile = slot => {
    const bk = bookings.find(b => b.slot === slot.id);
    const sel = selected.includes(slot.id);
    let cls = "s-free", st = "Kosong";
    if (bk && bk.status === "blok") { cls = "s-blok"; st = "🚫 " + (bk.alasan || "Ditutup").split(" ").slice(0, 2).join(" "); }
    else if (bk) { cls = bk.status === "pending" ? "s-pend" : "s-busy"; st = (bk.status === "pending" ? "⏳ " : "") + bk.nama.split(" ")[0]; }
    else if (slot.nilam && !admin) { cls = "s-nilam"; st = "🔒 Nilam"; }
    else if (slot.luar) { cls = "s-luar"; st = "Perlu lulus"; }
    if (sel && !bk) { cls = "s-sel"; st = "✓ Dipilih"; }
    const locked = !!bk || wholeDay || (slot.nilam && !admin);
    return h("button", { key: slot.id, type: "button", disabled: locked, className: "slot " + cls, onClick: () => onToggle(slot) },
      h("span", { className: "slot-id" }, slot.id),
      h("span", { className: "slot-time" }, slot.time),
      h("span", { className: "slot-st" }, st));
  };
  return h("div", null,
    h("div", { className: "board-cap" }, "Waktu biasa"),

function CutiPicker({ bookings, nama, onSubmit }) {
  const [mula, setMula] = useState("08:00");
  const [tamat, setTamat] = useState("09:00");
  const [err, setErr] = useState("");
  const dur = toMins(tamat) - toMins(mula);
  const presets = [["08:00", "10:00"], ["10:00", "12:00"], ["13:00", "15:00"], ["08:00", "12:00"]];
  function submit() {
    const m1 = toMins(mula), m2 = toMins(tamat);
    if (m2 <= m1) return setErr("Masa tamat mesti selepas masa mula.");
    if (m2 - m1 < 30) return setErr("Tempahan minimum 30 minit.");
    const clash = bookings.find(b => b.mula && overlaps(m1, m2, toMins(b.mula), toMins(b.tamat)));
    if (clash) return setErr("Masa bertindih dengan " + clash.nama + " (" + clash.mula + " – " + clash.tamat + ").");
    if (bookings.some(b => b.nama === nama)) return setErr("Anda sudah ada tempahan pada hari ini.");
    setErr("");
    onSubmit(mula, tamat);
  }
  return h("div", { className: "glass" },
    h("div", { className: "eyebrow" }, "Hari cuti · pilih masa"),
    h("div", { className: "grid2", style: { marginTop: 10 } },
      h("div", null, h("div", { className: "label" }, "Mula"),
        h("input", { className: "field", type: "time", value: mula, onChange: e => setMula(e.target.value) })),
      h("div", null, h("div", { className: "label" }, "Tamat"),
        h("input", { className: "field", type: "time", value: tamat, onChange: e => setTamat(e.target.value) }))),
    h("div", { className: "chips" }, presets.map(([a, b]) =>
      h("button", { key: a + b, className: "chip", onClick: () => { setMula(a); setTamat(b); } }, a + " – " + b))),
    dur > 0 && h("div", { className: "hint" }, "Tempoh: " + dur + " minit"),
    err && h("div", { className: "err-box" }, "⚠ " + err),
    h("button", { className: "btn btn-primary block", onClick: submit }, "Hantar tempahan"));
}

/* ───────────── App ───────────── */
function App() {
  const [date, setDate] = useState(todayStr());
  const [tab, setTab] = useState("book");
  const [bookings, setBookings] = useState([]);
  const [loadingDay, setLoadingDay] = useState(true);
  const [holidays, setHolidays] = useState([]);
  const [cal, setCal] = useState({ counts: {}, blocked: {} });
  const [guru, setGuru] = useState(GURU_LIST);
  const [todayList, setTodayList] = useState([]);
  const [nama, setNama] = useState("");
  const [alasan, setAlasan] = useState("");
  const [alasanLain, setAlasanLain] = useState("");
  const [selected, setSelected] = useState([]);
  const [wholeDay, setWholeDay] = useState(false);
  const [sema, setSema] = useState(false);
  const [admin, setAdmin] = useState(false);
  const [showPin, setShowPin] = useState(false);
  const [reminder, setReminder] = useState(false);
  const [dayModal, setDayModal] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [nonce, setNonce] = useState(0);

  const today = todayStr();
  const cuti = isCuti(date, holidays);
  const flash = m => setMsg(m);
  const fail = t => setMsg({ type: "err", text: t });
  const ok = t => setMsg({ type: "ok", text: t });

  const refreshCounts = () => db.calCounts().then(setCal).catch(() => {});
  async function syncAll() {
    try {
      const [rows] = await Promise.all([db.bookingsOn(date), refreshCounts()]);
      setBookings(rows);
      setNonce(n => n + 1);
    } catch (e) { fail("Gagal kemas kini data."); }
  }

  // muat data awal + peringatan harian (sekali sesi)
  useEffect(() => {
    db.holidays().then(setHolidays).catch(() => {});
    db.guru().then(g => { if (g.length) setGuru(g); }).catch(() => {});
    refreshCounts();
    db.bookingsOn(todayStr()).then(rows => {
      const live = rows.filter(r => r.status !== "blok");
      setTodayList(live);
      if (live.length && !seenToday()) setReminder(true);
    }).catch(() => {});
  }, []);

  // tukar tarikh → muat semula tempahan
  useEffect(() => {
    let alive = true;
    setLoadingDay(true);
    db.bookingsOn(date).then(rows => {
      if (!alive) return;
      setBookings(rows);
      setAlasan(""); setAlasanLain("");
      setSelected(wholeDay || sema ? AVAIL.filter(id => !rows.some(b => b.slot === id)) : []);
    }).catch(() => { if (alive) fail("Gagal memuatkan tempahan. Semak sambungan."); })
      .finally(() => { if (alive) setLoadingDay(false); });
    return () => { alive = false; };
  }, [date]);

  useEffect(() => {
    if (!msg) return;
    const t = setTimeout(() => setMsg(null), 4500);
    return () => clearTimeout(t);
  }, [msg]);

  /* derived */
  const pendingBk = bookings.filter(b => b.status === "pending");
  const bookedAvail = AVAIL.filter(id => bookings.some(b => b.slot === id && b.status !== "blok")).length;
  const blockedAvail = AVAIL.filter(id => bookings.some(b => b.slot === id && b.status === "blok")).length;
  const freeN = AVAIL.length - bookedAvail - blockedAvail;
  const fullBlocked = blockedAvail >= AVAIL.length;
  const blockReason = (bookings.find(b => b.status === "blok") || {}).alasan;
  const normalSel = wholeDay ? AVAIL.length : selected.filter(id => !isLuar(id)).length;
  const hasLuar = selected.some(isLuar);
  const freeIds = () => AVAIL.filter(id => !bookings.some(b => b.slot === id));

  /* pilihan slot */
  function toggle(slot) {
    if (wholeDay || (slot.nilam && !admin) || bookings.some(b => b.slot === slot.id)) return;
    if (slot.id === "Petang" && selected.includes("Malam")) return;
    if (slot.id === "Malam" && selected.includes("Petang")) return;
    setSema(false);
    setSelected(p => p.includes(slot.id) ? p.filter(x => x !== slot.id) : [...p, slot.id]);
  }
  function pickAll() { setSelected(freeIds()); setSema(true); }
  function toggleWhole(on) { setWholeDay(on); setSema(false); setSelected(on ? freeIds() : []); }

  /* admin */
  function loginAdmin() {
    setAdmin(true); setShowPin(false);
    setNama("PENGURUSAN"); setAlasan("Pengurusan"); setSelected([]);
    ok("Mod pengurusan dibuka.");
  }
  function logout() {
    setAdmin(false); setWholeDay(false); setSema(false); setSelected([]);
    setNama(""); setAlasan(""); setAlasanLain("");
    ok("Mod pengurusan ditutup.");
  }
  async function approve(id) {
    try { await db.setStatus(id); await syncAll(); ok("Tempahan diluluskan ✓"); }
    catch (e) { fail("Gagal luluskan tempahan."); }
  }
  async function removeBooking(id) {
    try { await db.remove(id); await syncAll(); ok("Tempahan dipadam."); }
    catch (e) { fail("Gagal padam tempahan."); }
  }

  /* hantar tempahan slot */
  async function hantar() {
    if (!nama) return fail("Sila pilih nama guru.");
    if (!admin && !alasan) return fail("Sila pilih tujuan penggunaan.");
    if (!admin && alasan === "Lain-lain" && !alasanLain.trim()) return fail("Sila nyatakan tujuan penggunaan.");
    if (!selected.length) return fail("Pilih sekurang-kurangnya satu slot.");
    setBusy(true);
    try {
      // semak semula dari pangkalan data — elak tempahan bertindih
      const fresh = await db.bookingsOn(date);
      const existing = nama === "PENGURUSAN" ? [] : fresh.filter(b => b.nama === nama && b.slot && !b.mula);
      if (!admin && existing.length > 0) {
        const total = existing.length + selected.filter(id => !isLuar(id)).length;
        if (total > 3) {
          setBookings(fresh);
          return fail("Had maksimum 3 slot sehari. Anda sudah ada " + existing.length + " slot ditempah.");
        }
      }
      if (admin) {
        const ov = selected.filter(id => fresh.some(b => b.slot === id));
        if (ov.length) await db.removeSlots(date, ov);
      }
      const normalCount = selected.filter(id => AVAIL.includes(id)).length;
      const rows = selected.map(id => {
        const luar = isLuar(id);
        let status;
        if (nama === "PENGURUSAN") status = luar ? "pending" : "lulus";
        else status = (luar || (wholeDay && AVAIL.includes(id)) || (!luar && !wholeDay && normalCount > 3)) ? "pending" : "lulus";
        return {
          id: String(Date.now() + Math.random()), slot: id, nama,
          alasan: alasan === "Lain-lain" ? alasanLain.trim() : (alasan || null),
          status, masa: new Date().toLocaleTimeString("ms-MY")
        };
      });
      await db.insert(date, rows);
      const hadLuar = hasLuar;
      const over3 = !wholeDay && normalSel > 3;
      setSelected([]); setNama(""); setAlasan(""); setAlasanLain("");
      setWholeDay(false); setSema(false);
      await syncAll();
      ok(hadLuar ? "Dihantar — Petang/Malam menunggu kelulusan admin."
        : over3 ? "Tempahan dihantar — sila maklumkan Guru ICT untuk pengesahan."
          : "Tempahan berjaya!");
      burst();
    } catch (e) {
      fail("Gagal hantar tempahan. Cuba semula.");
    } finally {
      setBusy(false);
    }
  }

  /* hantar tempahan cuti (masa bebas) */
  async function hantarCuti(mula, tamat) {
    setBusy(true);
    try {
      await db.insert(date, [{ id: String(Date.now()), mula, tamat, nama, status: "lulus", masa: new Date().toLocaleTimeString("ms-MY") }]);
      setNama("");
      await syncAll();
      ok("Tempahan cuti " + mula + " – " + tamat + " berjaya.");
      burst();
    } catch (e) { fail("Gagal hantar tempahan cuti."); }
    setBusy(false);
  }

  /* ─── bahagian UI ─── */
  const dateBar = h("div", { className: "glass datebar" },
    h("button", { className: "arrow", disabled: date <= today, onClick: () => setDate(addDays(date, -1)), "aria-label": "Hari sebelum" }, "‹"),
    h("label", { className: "dt" },
      h("div", { className: "eyebrow" }, date === today ? "Hari ini" : "Tarikh dipilih"),
      h("div", { className: "dt-big" }, fmtDate(date, { weekday: "long", day: "numeric", month: "short" })),
      h("input", { type: "date", className: "mini-date", value: date, min: today, onChange: e => e.target.value && setDate(e.target.value) })),
    h("button", { className: "arrow", onClick: () => setDate(addDays(date, 1)), "aria-label": "Hari seterusnya" }, "›"));

  const statsCard = cuti
    ? h("div", { className: "glass" },
      h("div", { className: "stat-row two" },
        statBox("stat-free", bookings.filter(b => b.status === "lulus").length, "Lulus"),
        statBox("stat-pend", pendingBk.length, "Pending")))
    : h("div", { className: "glass" },
      h("div", { className: "stat-row" },
        statBox("stat-free", freeN, "Kosong"),
        statBox("stat-busy", bookedAvail, "Ditempah"),
        statBox("stat-pend", pendingBk.length, "Pending")),
      h("div", { className: "meter" }, h("i", { style: { width: (bookedAvail / AVAIL.length * 100) + "%" } })));

  const pendingCard = admin && pendingBk.length > 0 && h("div", { className: "glass pend-card" },
    h("div", { className: "eyebrow", style: { marginBottom: 10 } }, "⏳ Menunggu kelulusan · " + pendingBk.length),
    pendingBk.map(b => h(Ticket, {
      key: b.id, b,
      actions: h("div", { className: "btn-row" },
        h("button", { className: "btn btn-ok btn-sm", onClick: () => approve(b.id) }, "Lulus"),
        h("button", { className: "btn btn-danger btn-sm", onClick: () => confirmDel(() => removeBooking(b.id)) }, "✕"))
    })));

  const nameCard = h("div", { className: "glass" },
    h("div", { className: "eyebrow" }, "1 · Nama guru"),
    h("select", {
      className: "field", style: { marginTop: 8 }, value: nama,
      onChange: e => { setNama(e.target.value); setSelected([]); setAlasan(""); setAlasanLain(""); setSema(false); }
    },
      h("option", { value: "" }, "— Pilih nama —"),
      h("option", { value: "PENGURUSAN" }, "⭐ PENGURUSAN"),
      guru.filter(n => n !== "PENGURUSAN").map(n => h("option", { key: n, value: n }, n))));

  const closedCard = fullBlocked && h("div", { className: "glass closed-card" },
    h("div", { className: "eyebrow" }, "🚫 Tarikh ditutup"),
    h("div", { style: { fontSize: 16, fontWeight: 800, marginTop: 6 } }, blockReason || "Ditutup"),
    h("div", { className: "muted", style: { marginTop: 4 } }, "Tiada tempahan dibenarkan pada tarikh ini."));

  const purposeCard = nama && !cuti && !admin && !fullBlocked && h("div", { className: "glass" },
    h("div", { className: "eyebrow" }, "2 · Tujuan penggunaan"),
    h("select", {
      className: "field", style: { marginTop: 8 }, value: alasan,
      onChange: e => setAlasan(e.target.value)
    },
      h("option", { value: "" }, "— Pilih tujuan —"),
      PURPOSES.map(([v, l]) => h("option", { key: v, value: v }, l))),
    alasan === "Lain-lain" && h("input", {
      className: "field", style: { marginTop: 8 }, placeholder: "Nyatakan tujuan…",
      value: alasanLain, onChange: e => setAlasanLain(e.target.value)
    }));

  const boardCard = nama && !cuti && !fullBlocked && h("div", { className: "glass" },
    h("div", { className: "row-between" },
      h("div", { className: "eyebrow" }, "3 · Pilih slot"),
      !admin && h("button", { className: "chip chip-amber", onClick: pickAll }, "⚡ Semua slot")),
    admin && h("label", { className: "check" },
      h("input", { type: "checkbox", checked: wholeDay, onChange: e => toggleWhole(e.target.checked) }),
      "Tempahan sehari penuh (semua slot)"),
    loadingDay ? h(Spinner) :
      h(SlotBoard, { bookings, selected, onToggle: toggle, wholeDay, admin }));

  const cutiCard = cuti && !fullBlocked && (nama
    ? h(CutiPicker, { bookings, nama, onSubmit: hantarCuti })
    : h("div", { className: "hint-card" }, "🏖 Hari cuti — pilih nama untuk tempah masa bebas"));

  const listCard = h("div", { className: "glass" },
    h("div", { className: "eyebrow", style: { marginBottom: 10 } }, "Tempahan pada tarikh ini · " + bookings.length),
    bookings.length === 0 ? h("div", { className: "empty" }, "Belum ada tempahan 🌤") :
      bookings.map(b => h(Ticket, {
        key: b.id, b,
        actions: admin && h("button", { className: "btn btn-danger btn-sm", onClick: () => confirmDel(() => removeBooking(b.id)) }, "✕")
      })));

  const bookTab = h(React.Fragment, null,
    dateBar, statsCard, closedCard, pendingCard, nameCard, purposeCard, boardCard, cutiCard, listCard,
    admin && h(AdminPanel, { guru, setGuru, holidays, setHolidays, nonce, onChanged: syncAll, flash }));

  const dock = tab === "book" && nama && !cuti && !fullBlocked && !loadingDay && h("div", { className: "dock" },
    h("div", { className: "dock-in" },
      h("div", { className: "dock-info" },
        selected.length === 0
          ? "Belum pilih slot"
          : h("div", null, h("b", null, selected.length + " slot"), h("span", { className: "dock-list" }, " · " + selected.join(", "))),
        hasLuar && h("span", { className: "warn" }, "⚠ Petang/Malam perlu kelulusan admin"),
        !wholeDay && normalSel > 3 && h("span", { className: "warn" }, "⚠ Lebih 3 slot — perlu pengesahan Guru ICT")),
      h("button", { className: "btn btn-primary", disabled: busy || !selected.length, onClick: hantar }, busy ? "…" : "Hantar ✈")));

  const hero = h("header", { className: "hero" },
    h("img", { src: LOGO, alt: "Logo", className: "logo" }),
    h("div", { style: { flex: 1, minWidth: 0, position: "relative", zIndex: 1 } },
      h("div", { className: "hero-eyebrow" }, "MAAHAD PONTIAN · SISTEM TEMPAHAN"),
      h("div", { className: "hero-title" }, "Bilik Komputer"),
      h("div", { className: "hero-sub" },
        fullBlocked ? "🚫 Tarikh ditutup" : cuti ? "🏖 Hari cuti · tempah masa bebas" : freeN + " dari " + AVAIL.length + " slot kosong")),
    h("button", {
      className: "lock " + (admin ? "on" : ""), title: "Mod pengurusan",
      onClick: () => admin ? logout() : setShowPin(true)
    }, admin ? "🔓" : "🔒"));

  const seg = h("div", { className: "seg" },
    [["book", "✨ Tempah"], ["mine", "🗂 Saya"], ["cal", "🗓 Kalendar"]].map(([id, l]) =>
      h("button", { key: id, className: tab === id ? "on" : "", onClick: () => setTab(id) }, l)));

  return h("div", { className: "wrap" },
    msg && h(Toast, { msg }),
    reminder && h(ReminderModal, { list: todayList, onClose: () => setReminder(false) }),
    showPin && h(PinModal, { onOk: loginAdmin, onClose: () => setShowPin(false) }),
    dayModal && h(DayModal, {
      ds: dayModal, holidays, onClose: () => setDayModal(null),
      onBook: d => { setDate(d); setTab("book"); setDayModal(null); }
    }),
    hero,
    seg,
    tab === "book" && bookTab,
    tab === "mine" && h(MyTab, { guru, onChanged: syncAll, flash }),
    tab === "cal" && h(CalTab, { date, counts: cal.counts, blocked: cal.blocked, holidays, onPick: setDayModal }),
    dock);
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
